name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — vet, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 先生成静态产物，Go 的 embed 编译和静态资源测试依赖它。
      - name: Frontend build and type check
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # go.mod 里锁的就是这个版本，装同版本才测得准
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # gofmt 只做格式检查，不写文件。本地忘跑 format 就在 CI 挡下。
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化（本地跑 gofmt -w . 修复）："
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 单测 + e2e 同一条命令。JWT_SECRET 是测试自己灌的，这里给一个
      # 只是为了让 .env 缺失时的启动路径也有东西可读。
      - name: Test
        run: go test -race ./... -count=1
        env:
          JWT_SECRET: ci-only-0123456789abcdef-fedcba9876543210
          LOG_SILENT: "1"
