server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets — aggressive caching (Vite hashes filenames)
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Reverse proxy to server (v1 API)
  location /v1/api/ {
    proxy_pass http://server:3000/v1/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Allow large notify bodies & long polling
    proxy_read_timeout 60s;
    client_max_body_size 5m;
  }

  # Keep /api/ proxy for backward compatibility (Alipay/PayPal callbacks, Swagger)
  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
  }

  # Health endpoint passthrough
  location /health {
    proxy_pass http://server:3000/health;
    proxy_http_version 1.1;
  }

  # Socket.IO upgrade
  location /socket.io/ {
    proxy_pass http://server:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml font/woff2 image/svg+xml;
}
