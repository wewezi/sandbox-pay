<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单 · Sandbox Pay</title>
  <link rel="stylesheet" href="/app.css">
  <!-- 同步加载，且不能是 module：主题属性必须在首次绘制前写上，否则会闪白底。原因见 theme.js -->
  <script src="/theme.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="panel">
      <form class="row" id="filters">
        <div class="field grow">
          <label for="keyword">关键词</label>
          <input id="keyword" placeholder="订单号 / 外部单号">
        </div>
        <div class="field sm">
          <label for="status">状态</label>
          <select id="status">
            <option value="">全部</option>
            <option value="0">待支付</option>
            <option value="1">已支付</option>
            <option value="2">失败</option>
            <option value="3">退款中</option>
            <option value="4">已退款</option>
            <option value="-1">已过期</option>
          </select>
        </div>
        <div class="field sm">
          <label for="payMethod">渠道</label>
          <select id="payMethod">
            <option value="">全部</option>
            <option value="alipay">支付宝</option>
            <option value="paypal">PayPal</option>
            <option value="native">自有</option>
          </select>
        </div>
        <div class="field sm">
          <label for="dateFrom">起始日期</label>
          <input id="dateFrom" type="date">
        </div>
        <div class="field sm">
          <label for="dateTo">截止日期</label>
          <input id="dateTo" type="date">
        </div>
        <button class="primary" type="submit">查询</button>
        <button type="reset">重置</button>
      </form>
    </div>

    <div class="panel">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>订单号</th>
              <th>商品</th>
              <th>渠道</th>
              <th class="num">金额</th>
              <th class="num">已退</th>
              <th class="num">手续费</th>
              <th>状态</th>
              <th>创建</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>没有符合条件的订单</div>
      <div id="pager"></div>
    </div>
  </div>

  <!-- 结构写在这里，orders.js 只 clone + 填字段。没有 innerHTML，天然符合 CSP。 -->
  <template id="tpl-stat">
    <div class="stat">
      <div class="k" data-k></div>
      <div class="v" data-v></div>
    </div>
  </template>

  <template id="tpl-order-row">
    <tr>
      <td class="mono" data-order></td>
      <td class="wrapped" data-product></td>
      <td data-channel></td>
      <td class="num" data-amount></td>
      <td class="num" data-refunded></td>
      <td class="num" data-fee></td>
      <td><span class="badge" data-status></span></td>
      <td class="small muted" data-time></td>
      <td class="acts" data-acts></td>
    </tr>
  </template>

  <!--
    退款弹窗。原来是 el() 手拼一层 .mask + .modal 自己实现遮罩和居中，
    换成原生 <dialog>：焦点陷阱、Esc 关闭、::backdrop 都是白拿的。
    包一层 <form method="dialog"> 让「取消」不用写 JS。
  -->
  <template id="tpl-refund">
    <dialog class="modal">
      <!--
        金额的上限 max 由 orders.js 按可退余额写上，校验交给浏览器：
        submit 事件在约束不满足时根本不会触发，气泡直接指到出错的输入框。
        不写 method="dialog" —— 那会在 POST 发出前就把弹窗关掉。
      -->
      <form data-form>
        <h3>退款</h3>
        <p class="muted small" data-summary></p>
        <label for="r-amount">退款金额（元）</label>
        <input id="r-amount" data-amount type="number" step="0.01" min="0.01" required>
        <div class="stack">
          <label for="r-reason">退款原因</label>
          <input id="r-reason" data-reason maxlength="255" placeholder="选填">
        </div>
        <div class="acts">
          <button type="button" data-cancel>取消</button>
          <button class="primary" type="submit" data-submit>提交退款</button>
        </div>
      </form>
    </dialog>
  </template>

  <script type="module" src="/orders.js"></script>
</body>
</html>
