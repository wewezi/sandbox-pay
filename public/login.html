<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Sandbox Pay</title>
  <link rel="stylesheet" href="/app.css">
  <!-- 同步加载，且不能是 module：主题属性必须在首次绘制前写上，否则会闪白底。原因见 theme.js -->
  <script src="/theme.js"></script>
</head>
<body>
  <div class="wrap narrow">
    <div class="panel">
      <h2>Sandbox Pay 后台</h2>
      <form id="form" class="stack">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="20">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="72">
        </div>
        <button id="submit" class="primary block" type="submit">登录</button>
      </form>
      <p class="small muted">账号用 <span class="mono">go run . create-admin &lt;用户名&gt; &lt;密码&gt;</span> 创建。</p>
    </div>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
