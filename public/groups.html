<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分组与 Key · Sandbox Pay</title>
  <link rel="stylesheet" href="/app.css">
  <!-- 同步加载，且不能是 module：主题属性必须在首次绘制前写上，否则会闪白底。原因见 theme.js -->
  <script src="/theme.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap mid">
    <div class="panel">
      <h2>新建分组</h2>
      <form class="row" id="createGroup">
        <div class="field grow">
          <label for="groupName">分组名</label>
          <input id="groupName" required maxlength="100" placeholder="例如：本地开发">
        </div>
        <div class="field grow">
          <label for="firstKeyName">第一把 Key 备注</label>
          <input id="firstKeyName" maxlength="100" placeholder="默认">
        </div>
        <button class="primary" type="submit">创建</button>
      </form>
      <p class="muted small">
        调网关只需要一把 Key：<span class="mono">Authorization: Bearer &lt;apiKey&gt;</span>。
        没有时间戳和签名。一个分组可以有多把，用来轮换或区分环境。
      </p>
      <p class="muted small">
        我们回调你的 <span class="mono">notifyUrl</span> 时会带
        <span class="mono">X-Sandbox-Pay-Timestamp / Nonce / Signature</span>，
        签名是 <span class="mono">HMAC-SHA256(body + timestamp + nonce, 下单那把 Key)</span>。
        停用 Key 只挡入站，已有订单的回调仍用原 Key 签 —— 接入方那边验签不用改。
      </p>
    </div>

    <div id="groups"></div>
  </div>

  <!--
    结构写在这里，JS 只管 clone + 填字段（见 groups.js）。
    比在 JS 里 el() 手拼 DOM 树看得清，而且没有 innerHTML，天然符合 CSP。

    刻意不用 shadow DOM：app.css 是全局样式表，套了 shadow root 之后
    .panel / .badge / .acts 这些类全都进不去，得把样式复制一份进每个组件。
  -->
  <template id="tpl-group-card">
    <div class="panel">
      <div class="panel-head">
        <h2 data-name></h2>
        <div class="row">
          <span class="badge" data-status></span>
          <button data-toggle-group></button>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>备注</th>
              <th>API Key</th>
              <th>状态</th>
              <th>最近使用</th>
              <th></th>
            </tr>
          </thead>
          <tbody data-keys></tbody>
        </table>
      </div>
      <form class="row" data-issue-form>
        <div class="field grow">
          <label data-issue-label>签发新 Key</label>
          <input data-issue-input maxlength="100" placeholder="备注名，例如 CI / 本地">
        </div>
        <button class="primary" type="submit">签发</button>
      </form>
    </div>
  </template>

  <template id="tpl-key-row">
    <tr>
      <td data-key-name></td>
      <td><sp-secret></sp-secret></td>
      <td><span class="badge" data-key-status></span></td>
      <td data-key-used></td>
      <td class="acts"><button data-toggle-key></button></td>
    </tr>
  </template>

  <!-- <sp-secret> 内部结构：打码显示 + 显示/隐藏 + 复制 -->
  <template id="tpl-secret">
    <span class="mono" data-value></span>
    <button data-reveal></button>
    <button data-copy>复制</button>
  </template>

  <script type="module" src="/groups.js"></script>
</body>
</html>
